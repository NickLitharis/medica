[project]
name = "medica"
version = "0.1.0"
description = "Medical image captioning with a CNN and attention RNN in TensorFlow - BSc thesis on ImageCLEF 2017 (BLEU-1 0.309)"
readme = "readme.md"
# The notebooks were written against TensorFlow 2.15, but 2.15 is no longer obtainable: the
# oldest version Kaggle still serves is 2.20, and no installable Windows wheel exists for it
# at all. The model code is Keras-3 clean, so the floor moves to a version that can actually
# be installed, and the ceiling stays below TensorFlow 3.
requires-python = ">=3.9,<3.13"
license = "MIT"
dependencies = [
    "tensorflow>=2.16,<3",
    "numpy",
    "tqdm",
    "pickle-mixin",
    "nltk",
    "rouge",
    "pycocoevalcap",
    "matplotlib",
    "Pillow",
]

# Notebook collection, not a distributable package.
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

# Bare `pytest` does not put the repository root on sys.path, so `import model` fails.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
